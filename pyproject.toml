[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altsvc"
version = "0.2.0"
description = "Parse, check and build the HTTP Alt-Svc header (RFC 7838), typed and zero-dependency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["alt-svc", "alternative-services", "http", "headers", "rfc7838", "http3", "alpn", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.scripts]
altsvc = "altsvc._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/altsvc"
Issues = "https://github.com/JaviLianes8/altsvc/issues"
Changelog = "https://github.com/JaviLianes8/altsvc/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/altsvc"]

[tool.hatch.build.targets.sdist]
# Third-party reference files are fetched locally and never shipped; only their manifest is.
exclude = [
    ".github",
    "IMPROVEMENTS-round*.md",
    "tests/upstream/*.txt",
    "tests/upstream/*.html",
    "tests/upstream/*.csv",
    "tests/upstream/*.xml",
    "tests/upstream/*.cc",
    "tests/upstream/*.c",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
